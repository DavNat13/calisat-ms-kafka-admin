services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calisat-ms-kafka-admin
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: "8091"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-kafka:29092}
    networks:
      - calisat-net

networks:
  calisat-net:
    name: calisat-net
    driver: bridge
